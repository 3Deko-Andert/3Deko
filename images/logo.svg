<svg viewBox="0 0 220 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="logoTitle" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="logoTitle">3Deko Logo</title>
  <!-- Spiral "3", gedacht wie eine Vase im Spiralmodus gedruckt -->

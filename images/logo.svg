           C 92 18, 122 26, 122 46
           C 122 62, 100 68, 84 68
           C 104 68, 128 74, 128 94
           C 128 116, 96 124, 62 112"
        fill="none" stroke="#B98F7C" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- feine innere Rille, wie Drucklagen -->
  <path d="M64 40
           C 90 32, 110 38, 110 48
           C 110 58, 94 61, 82 60"
        fill="none" stroke="#CBA46A" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

  <!-- kleine schwebende Deko-Elemente -->
  <circle cx="34" cy="24" r="5" fill="#ADB79C"/>
  <circle cx="150" cy="100" r="4" fill="#B9A2A8"/>
  <path d="M148 30 l4 8 l8 2 l-8 3 l-4 8 l-3 -8 l-8 -3 l8 -2 z" fill="#CBA46A"/>
  <path d="M28 100 l3 6 l6 2 l-6 2 l-3 6 l-3 -6 l-6 -2 l6 -2 z" fill="#D9BCAE" opacity="0.85"/>

  <!-- gepunktete Umlaufbahn -->
  <path d="M18 70 C 18 30, 60 6, 108 6 C 156 6, 198 30, 198 70 C 198 110, 156 134, 108 134 C 76 134, 46 122, 30 100"
        fill="none" stroke="#B9A2A8" stroke-width="2" stroke-dasharray="1 9" stroke-linecap="round" opacity="0.6"/>
</svg>
